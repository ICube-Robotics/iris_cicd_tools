[project]
name = "iris-cicd-tools"
version = "0.1.0"
description = "Python library to handle CI/CD tools for IRIS projects"
readme = "README.rst"
authors = [{ name = "Manuel YGUEL", email = "yguel@unistra.fr" }]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "typeguard>=4.5.1",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

# Ensures the HTML template is included in the built wheel
[tool.uv_build]
include = ["src/iris_cicd_tools/index.template.html"]
